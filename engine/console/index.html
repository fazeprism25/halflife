<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halflife</title>
  <meta name="description" content="Halflife: claim-level freshness for LLM traffic through Bifrost.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell" id="shell" data-sidebar="closed" data-mode="overlay">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="sidebar" title="Show navigation">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" /></svg>
        <span class="sr-only" id="menu-label">Show navigation</span><span class="sr-only" id="menu-new"></span>
        <span class="new-dot" aria-hidden="true"></span>
      </button>
      <a class="brand" href="#/inspector" aria-label="Halflife home">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/>
        </svg>
        <span class="brand-name">Halflife</span>
        <span class="brand-sub">freshness layer for Bifrost</span>
      </a>
      <span class="topbar-end">
        <span class="live" id="live" data-state="connecting"><span class="live-dot"></span><span id="live-label">Connecting</span></span>
      </span>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Sidebar" data-open="false">
      <div class="sidebar-inner">
        <div class="sidebar-head">
          <span class="sidebar-title">Menu</span>
          <button class="icon-btn" id="sidebar-close" type="button" aria-label="Hide navigation" title="Hide navigation">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" /></svg>
          </button>
        </div>
        <nav class="nav" id="nav" aria-label="Primary">
          <a href="#/inspector" data-route="inspector">Inspector <span class="count" id="nav-count"></span></a>
          <a href="#/check" data-route="check">Check</a>
          <a href="#/model" data-route="model">Freshness model</a>
          <a href="#/system" data-route="system">System</a>
          <div class="nav-group" id="nav-chatgpt">ChatGPT</div>
          <a href="#/activity" data-route="activity">Activity</a>
          <a href="#/claims" data-route="claims">Claim explorer</a>
          <a href="#/trends" data-route="trends">Trends</a>
          <a href="#/extension" data-route="extension">Extension</a>
        </nav>
        <section class="traffic" id="traffic" data-expanded="false">
          <h2 class="traffic-h">
            <button class="traffic-toggle" id="traffic-toggle" type="button" aria-expanded="false" aria-controls="traffic-panel" aria-keyshortcuts="t" title="Traffic (T)">
              <svg class="icon chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4" /></svg>
              <span>Traffic</span><span class="traffic-count" id="traffic-count"></span>
              <span class="new-dot" aria-hidden="true"></span><span class="sr-only" id="traffic-new"></span>
            </button>
          </h2>
          <div class="traffic-panel" id="traffic-panel" hidden></div>
        </section>
        <div class="rail-foot">
          <button class="theme-toggle" id="theme" type="button">Theme: system</button>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>
    <main id="main" tabindex="-1"></main>
  </div>
</body>
</html>
